services:
  expense-service:
    build: ./services/expense-service
    container_name: smartspend-expense-service
    ports:
      - "8000:8000"
    environment:
      SMARTSPEND_TEST_DB: /data/expenses.db
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./services/expense-service/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  budget-service:
    build: ./services/budget-service
    container_name: smartspend-budget-service
    ports:
      - "8001:8001"
    environment:
      SMARTSPEND_TEST_DB: /data/budgets.db
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./services/budget-service/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  analytics-service:
    build: ./services/analytics-service
    container_name: smartspend-analytics-service
    ports:
      - "8002:8002"
    environment:
      EXPENSE_SERVICE_URL: http://expense-service:8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      expense-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  alert-service:
    build: ./services/alert-service
    container_name: smartspend-alert-service
    ports:
      - "8003:8003"
    environment:
      EXPENSE_SERVICE_URL: http://expense-service:8000
      BUDGET_SERVICE_URL: http://budget-service:8001
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      expense-service:
        condition: service_healthy
      budget-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  savings-service:
    build: ./services/savings-service
    container_name: smartspend-savings-service
    ports:
      - "8004:8004"
    environment:
      SMARTSPEND_SAVINGS_DB: /data/savings.db
      EXPENSE_SERVICE_URL: http://expense-service:8000
      BUDGET_SERVICE_URL: http://budget-service:8001
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./services/savings-service/data:/data
    depends_on:
      expense-service:
        condition: service_healthy
      budget-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_BUDGET_API_URL: http://localhost:8001
        VITE_ANALYTICS_API_URL: http://localhost:8002
        VITE_ALERT_API_URL: http://localhost:8003
        VITE_SAVINGS_API_URL: http://localhost:8004
    container_name: smartspend-frontend
    ports:
      - "5173:80"
    depends_on:
      expense-service:
        condition: service_healthy
      budget-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
      savings-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
