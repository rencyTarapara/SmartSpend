apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: smartspend
  labels:
    app: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: smartspend-analytics-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: EXPENSE_SERVICE_URL
              value: http://expense-service.smartspend.svc.cluster.local:8000
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:5173,http://127.0.0.1:5173"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: smartspend
spec:
  selector:
    app: analytics-service
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
  type: ClusterIP
