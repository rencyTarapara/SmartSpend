apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-service
  namespace: smartspend
  labels:
    app: budget-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budget-service
  template:
    metadata:
      labels:
        app: budget-service
    spec:
      containers:
        - name: budget-service
          image: smartspend-budget-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: SMARTSPEND_TEST_DB
              value: /data/budgets.db
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:5173,http://127.0.0.1:5173"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: budget-data
              mountPath: /data
      volumes:
        - name: budget-data
          persistentVolumeClaim:
            claimName: budget-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: budget-service
  namespace: smartspend
spec:
  selector:
    app: budget-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP
