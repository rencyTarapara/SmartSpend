apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: expense-pvc
  namespace: smartspend
spec:
  storageClassName: ""          # no class, match manual PV
  volumeName: expense-pv        # bind to the correct PV
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
